name: CI

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Тесты (clang → kfc.py)
    runs-on: ubuntu-latest
    steps:
      - name: Проверить репозиторий
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Установить последнюю версию clang (apt.llvm.org)
        run: |
          set -e
          CODENAME=$(. /etc/os-release && echo "$VERSION_CODENAME")
          echo "кодовое имя дистрибутива: $CODENAME"

          if sudo wget -qO /etc/apt/trusted.gpg.d/llvm-snapshot.asc https://apt.llvm.org/llvm-snapshot.gpg.key \
              && echo "deb [signed-by=/etc/apt/trusted.gpg.d/llvm-snapshot.asc] http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME} main" \
                 | sudo tee /etc/apt/sources.list.d/llvm-apt.list >/dev/null \
              && sudo apt-get update -qq; then
            # Текущий стабильный мажор — наибольший clang-<N>, на который ссылается
            # метапакет «clang» (например, «clang-23»). Добавляем его суит,
            # чтобы метапакет установился.
            MAJOR=$(apt-cache show clang 2>/dev/null | grep -oE 'clang-[0-9]+' | sort -V | tail -1)
            if [ -n "$MAJOR" ]; then
              echo "текущий стабильный clang: $MAJOR"
              echo "deb [signed-by=/etc/apt/trusted.gpg.d/llvm-snapshot.asc] http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-${MAJOR#clang-} main" \
                | sudo tee -a /etc/apt/sources.list.d/llvm-apt.list >/dev/null
              sudo apt-get update -q || true
            fi
            if sudo apt-get install -y clang; then
              clang --version | head -1
              exit 0
            fi
          fi

          # Запасной путь: свежая ветка из того же репозитория, затем системный clang.
          echo "deb [signed-by=/etc/apt/trusted.gpg.d/llvm-snapshot.asc] http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-21 main" \
            | sudo tee -a /etc/apt/sources.list.d/llvm-apt.list >/dev/null || true
          sudo apt-get update -q || true
          if sudo apt-get install -y clang-21; then
            sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-21 100
          else
            sudo apt-get install -y clang
          fi
          clang --version | head -1

      - name: Установить зависимости транспилятора (jemalloc)
        run: sudo apt-get install -y libjemalloc-dev

      - name: Склонировать транспилятор Konda
        run: |
          set -e
          git clone --depth 1 https://github.com/daniliammo/Konda "$RUNNER_TEMP/ТранспиляторКонда"
          echo "KONDA_TRANSPILER=$RUNNER_TEMP/ТранспиляторКонда" >> "$GITHUB_ENV"
          # Транспилятор требует полный C23 (gcc >= 15 / clang >= 19). Штатный
          # gcc раннера слишком стар → собираем его через clang. CC=clang в среде
          # подхватит и «make» внутри прогон.sh (Makefile: «CC ?= cc»).
          echo "CC=clang" >> "$GITHUB_ENV"
          # -Werror транспилятора рассчитан на конкретный компилятор; свежий clang
          # раннера ловит иной класс предупреждений (напр. -Wformat-truncation).
          # Нам нужен рабочий бинарник транспилятора для тестов kfc, а не аудит его
          # варнингов → отключаем -Werror (штатный «make WERROR=» из его же доки).
          # WERROR= в среде переживёт «?=» в Makefile и в прогон.sh.
          echo "WERROR=" >> "$GITHUB_ENV"
          # Сгенерированный .elf транспилятор компилирует буквальным «cc» (не CC),
          # поэтому системный cc тоже переводим на clang — иначе старый gcc
          # раннера не осилит эмитируемый C23.
          sudo update-alternatives --install /usr/bin/cc cc "$(command -v clang)" 100

      - name: Собрать транспилятор Konda (clang, C23)
        run: make -C "$KONDA_TRANSPILER"

      - name: Проверить инструменты
        run: |
          clang --version | head -1
          python3 --version
          clang -Xclang -ast-dump=json -fsyntax-only примеры/demo.c >/dev/null && echo "ast-dump JSON OK"

      - name: Прогнать тесты (kfc.py → транспилятор → .elf)
        run: sh тесты/прогон.sh